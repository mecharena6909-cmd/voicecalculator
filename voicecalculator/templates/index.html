
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google-site-verification" content="ugNqtReIBORWjvmHZWHtdlhS_gTzaQPPcT1lYxbKif4">

<title>Rishav's Calculator</title>
<meta name="description" content="Rishav's Calculator - A smart voice and scientific calculator.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #080b14;
    --panel: #111827;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #8b5cf6;
    --accent2: #06b6d4;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Space Grotesk', sans-serif;
    background:
        radial-gradient(circle at 15% 15%, #312e8155, transparent 40%),
        radial-gradient(circle at 85% 80%, #0891b255, transparent 40%),
        var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.calculator {
    width: 100%;
    max-width: 520px;
    background: rgba(17, 24, 39, 0.85);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 28px;
    padding: 30px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.45);
    backdrop-filter: blur(20px);
}

.top {
    text-align: center;
    margin-bottom: 28px;
}

.logo {
    width: 70px;
    height: 70px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 15px;
    border-radius: 22px;
    background: linear-gradient(135deg, #8b5cf6, #06b6d4);
    font-size: 32px;
    box-shadow: 0 10px 30px #8b5cf644;
}

h1 {
    font-size: 28px;
    margin: 0;
    letter-spacing: -1px;
}

.subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 8px;
}

.label {
    font-size: 13px;
    color: var(--muted);
    display: block;
    text-align: left;
    margin-bottom: 10px;
}

.input-wrap {
    position: relative;
}

input {
    width: 100%;
    padding: 18px;
    padding-right: 50px;
    border: 1px solid #334155;
    border-radius: 16px;
    outline: none;
    font-family: inherit;
    font-size: 16px;
    color: white;
    background: #0b1220;
    transition: 0.2s;
}

input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px #8b5cf622;
}

input::placeholder {
    color: #64748b;
}

.clear {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    font-size: 20px;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
}

button {
    border: none;
    border-radius: 14px;
    padding: 15px;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    transition: transform 0.2s, opacity 0.2s;
}

button:hover {
    transform: translateY(-2px);
    opacity: 0.92;
}

button:active {
    transform: scale(0.97);
}

.calculate {
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: white;
}

.mic {
    background: linear-gradient(135deg, #0891b2, #06b6d4);
    color: white;
}

.mic.listening {
    background: #dc2626;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% {
        opacity: 0.6;
    }
}

.status {
    color: #67e8f9;
    font-size: 13px;
    min-height: 22px;
    margin: 14px 0 0;
    text-align: center;
}

.result {
    margin-top: 25px;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 22px;
    background: linear-gradient(135deg, #1e293b88, #0f172a);
    min-height: 130px;
}

.result-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.result-value {
    font-size: 36px;
    font-weight: 700;
    overflow-wrap: anywhere;
    margin-top: 18px;
    color: #a5b4fc;
}

.result-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.small-btn {
    background: #1e293b;
    color: #cbd5e1;
    border: 1px solid #334155;
    padding: 10px 14px;
    font-size: 13px;
}

.small-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.footer {
    text-align: center;
    color: #64748b;
    font-size: 12px;
    margin-top: 25px;
}

.footer span {
    color: #a78bfa;
}

@media (max-width: 480px) {
    .calculator {
        padding: 22px;
        border-radius: 23px;
    }

    h1 {
        font-size: 24px;
    }

    .result-value {
        font-size: 30px;
    }

    body {
        padding: 12px;
    }
}
</style>
</head>

<body>

<div class="calculator">

    <div class="top">
        <div class="logo">🧮</div>
        <h1>Rishav's Calculator</h1>
        <div class="subtitle">Smart calculations. Simple answers.</div>
    </div>

    <label class="label" for="question">ENTER YOUR CALCULATION</label>

    <div class="input-wrap">
        <input
            id="question"
            type="text"
            placeholder="Try 25 × 8 or 100 + 50..."
            autocomplete="off"
        >

        <button class="clear" onclick="clearInput()" title="Clear">×</button>
    </div>

    <div class="buttons">
        <button class="calculate" onclick="calculate()">⚡ Calculate</button>
        <button class="mic" id="micButton" onclick="startListening()">🎤 Speak</button>
    </div>

    <div class="status" id="status"></div>

    <div class="result">
        <div class="result-head">
            <span>Your Answer</span>
            <span>✦ Result</span>
        </div>

        <div class="result-value" id="answer">—</div>

        <div class="result-actions">
            <button class="small-btn" id="copyButton" onclick="copyAnswer()" disabled>📋 Copy</button>
            <button class="small-btn" id="speakButton" onclick="speakCurrentAnswer()" disabled>🔊 Speak</button>
        </div>
    </div>

    <div class="footer">
        Made with ❤️ by <span>Rishav</span>
    </div>

</div>

<script>
let currentAnswer = null;

async function calculate() {

    const question = document.getElementById("question").value.trim();
    const answerBox = document.getElementById("answer");
    const status = document.getElementById("status");

    if (!question) {
        status.innerText = "Please enter a calculation.";
        return;
    }

    answerBox.innerText = "Calculating...";
    status.innerText = "";

    document.getElementById("copyButton").disabled = true;
    document.getElementById("speakButton").disabled = true;

    try {

        const response = await fetch("/calculate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        if (!response.ok || data.success === false) {
            throw new Error(data.error || "Calculation failed");
        }

        currentAnswer = data.answer ?? data.result;

        answerBox.innerText = currentAnswer;
        status.innerText = "Calculation completed successfully!";

        document.getElementById("copyButton").disabled = false;
        document.getElementById("speakButton").disabled = false;

        speakAnswer(currentAnswer);

    } catch (error) {

        currentAnswer = null;
        answerBox.innerText = "Error";
        status.innerText = error.message;

    }
}

async function copyAnswer() {

    if (currentAnswer === null) return;

    try {
        await navigator.clipboard.writeText(String(currentAnswer));
        document.getElementById("status").innerText = "Answer copied!";
    } catch (error) {
        document.getElementById("status").innerText = "Copy failed. Please copy manually.";
    }
}

function speakCurrentAnswer() {

    if (currentAnswer !== null) {
        speakAnswer(currentAnswer);
    }
}

function speakAnswer(text) {

    if (!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(String(text));
    speech.lang = "en-IN";
    speech.rate = 1;

    window.speechSynthesis.speak(speech);
}

function clearInput() {

    document.getElementById("question").value = "";
    document.getElementById("answer").innerText = "—";
    document.getElementById("status").innerText = "";

    currentAnswer = null;

    document.getElementById("copyButton").disabled = true;
    document.getElementById("speakButton").disabled = true;

    window.speechSynthesis.cancel();

    document.getElementById("question").focus();
}

function startListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    const status = document.getElementById("status");
    const micButton = document.getElementById("micButton");

    if (!SpeechRecognition) {
        status.innerText = "Voice recognition is not supported in this browser.";
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.continuous = false;
    recognition.interimResults = false;

    micButton.classList.add("listening");
    micButton.innerText = "🔴 Listening...";
    status.innerText = "Listening. Speak now!";

    recognition.onresult = function(event) {

        const text = event.results[0][0].transcript;

        document.getElementById("question").value = text;
        status.innerText = "Recognized: " + text;

        calculate();
    };

    recognition.onerror = function(event) {
        status.innerText = "Voice error: " + event.error;
    };

    recognition.onend = function() {
        micButton.classList.remove("listening");
        micButton.innerText = "🎤 Speak";
    };

    try {
        recognition.start();
    } catch (error) {
        status.innerText = "Microphone could not start.";
        micButton.classList.remove("listening");
        micButton.innerText = "🎤 Speak";
    }
}

document.getElementById("question").addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        calculate();
    }
});
</script>

</body>
</html>
