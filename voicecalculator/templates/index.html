
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="ugNqtReIBORWjvmHZWHtdlhS_gTzaQPPcT1lYxbKif4">

<title>Rishav's Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Space Grotesk', sans-serif;
    color: white;
    background:
        radial-gradient(circle at top left, #243b65, transparent 40%),
        radial-gradient(circle at bottom right, #40205c, transparent 40%),
        #080d19;
}

.calculator {
    width: 100%;
    max-width: 410px;
    padding: 25px;
    border: 1px solid #ffffff20;
    border-radius: 25px;
    background: #101a2bdd;
    box-shadow: 0 20px 70px #0008;
}

h1 {
    text-align: center;
    font-size: 25px;
    margin: 0 0 5px;
}

.subtitle {
    text-align: center;
    color: #aab7d0;
    font-size: 13px;
    margin-bottom: 22px;
}

.display {
    background: #080f1e;
    border: 1px solid #ffffff15;
    border-radius: 16px;
    padding: 17px;
    margin-bottom: 17px;
    min-height: 115px;
}

#expression {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 25px;
    font-family: inherit;
    text-align: right;
}

#answer {
    text-align: right;
    color: #43e6a0;
    font-size: 27px;
    font-weight: 700;
    margin-top: 12px;
    overflow-wrap: anywhere;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 17px;
}

.control {
    border: none;
    border-radius: 13px;
    padding: 14px 8px;
    color: white;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.speak {
    background: linear-gradient(135deg, #1675ee, #3850d8);
}

.listen {
    background: linear-gradient(135deg, #8b45ed, #6134c9);
}

.control:active,
.key:active {
    transform: scale(.96);
}

.keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.key {
    border: 1px solid #ffffff12;
    border-radius: 13px;
    min-height: 57px;
    background: #202d43;
    color: white;
    font-family: inherit;
    font-size: 21px;
    font-weight: 600;
    cursor: pointer;
}

.operator {
    background: #30415d;
    color: #8dbaff;
}

.clear {
    background: #79364a;
    color: #ffd5df;
}

.equals {
    background: #087b58;
    color: white;
}

.status {
    min-height: 20px;
    text-align: center;
    color: #aab7d0;
    font-size: 12px;
    margin-top: 15px;
}

.credit {
    text-align: center;
    color: #71819c;
    font-size: 12px;
    margin-top: 15px;
}

@media(max-width: 360px) {
    .calculator {
        padding: 17px;
    }

    .key {
        min-height: 51px;
    }
}
</style>
</head>

<body>

<div class="calculator">

    <h1>🧮 Rishav's Calculator</h1>
    <div class="subtitle">Your Smart Voice Calculator</div>

    <div class="display">
        <input
            id="expression"
            type="text"
            placeholder="Enter calculation..."
            autocomplete="off"
        >
        <div id="answer">0</div>
    </div>

    <div class="controls">
        <button class="control speak" onclick="startListening()">
            🎤 SPEAK
        </button>

        <button class="control listen" onclick="listenAnswer()">
            🔊 LISTEN
        </button>
    </div>

    <div class="keypad">
        <button class="key clear" onclick="clearAll()">C</button>
        <button class="key operator" onclick="deleteLast()">⌫</button>
        <button class="key operator" onclick="addValue('(')">(</button>
        <button class="key operator" onclick="addValue(')')">)</button>

        <button class="key" onclick="addValue('7')">7</button>
        <button class="key" onclick="addValue('8')">8</button>
        <button class="key" onclick="addValue('9')">9</button>
        <button class="key operator" onclick="addValue('÷')">÷</button>

        <button class="key" onclick="addValue('4')">4</button>
        <button class="key" onclick="addValue('5')">5</button>
        <button class="key" onclick="addValue('6')">6</button>
        <button class="key operator" onclick="addValue('×')">×</button>

        <button class="key" onclick="addValue('1')">1</button>
        <button class="key" onclick="addValue('2')">2</button>
        <button class="key" onclick="addValue('3')">3</button>
        <button class="key operator" onclick="addValue('-')">−</button>

        <button class="key" onclick="addValue('0')">0</button>
        <button class="key" onclick="addValue('.')">.</button>
        <button class="key equals" onclick="calculate()">=</button>
        <button class="key operator" onclick="addValue('+')">+</button>
    </div>

    <div class="status" id="status">Ready to calculate!</div>

    <div class="credit">Made by Rishav</div>

</div>

<script>
const expressionInput = document.getElementById("expression");
const answerDisplay = document.getElementById("answer");
const statusDisplay = document.getElementById("status");

let currentAnswer = null;
let voiceEnabled = false;

function addValue(value) {
    expressionInput.value += value;
    expressionInput.focus();
}

function clearAll() {
    expressionInput.value = "";
    answerDisplay.textContent = "0";
    currentAnswer = null;

    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }

    statusDisplay.textContent = "Cleared!";
}

function deleteLast() {
    expressionInput.value = expressionInput.value.slice(0, -1);
    expressionInput.focus();
}

function speakText(text) {
    if (!("speechSynthesis" in window)) {
        statusDisplay.textContent = "Speech is not supported in this browser.";
        return;
    }

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(String(text));
    speech.lang = "en-IN";
    speech.rate = 0.9;

    window.speechSynthesis.speak(speech);
}

async function calculate() {
    const question = expressionInput.value.trim();

    if (!question) {
        statusDisplay.textContent = "Please enter a calculation!";
        return;
    }

    statusDisplay.textContent = "Calculating...";
    currentAnswer = null;

    try {
        const response = await fetch("/calculate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Calculation failed");
        }

        currentAnswer = data.result;
        answerDisplay.textContent = data.result;
        statusDisplay.textContent = "Calculation successful!";

        // Automatically speak the answer after a successful calculation.
        speakText("The answer is " + currentAnswer);

    } catch (error) {
        answerDisplay.textContent = "Error";
        statusDisplay.textContent = error.message;
    }
}

function listenAnswer() {
    if (currentAnswer === null) {
        statusDisplay.textContent = "Calculate something first!";
        return;
    }

    speakText("The answer is " + currentAnswer);
    statusDisplay.textContent = "Speaking your answer...";
}

function startListening() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        statusDisplay.textContent =
            "Voice input is not supported. Try Chrome.";
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.continuous = false;
    recognition.interimResults = false;

    voiceEnabled = true;
    statusDisplay.textContent = "🎤 Listening... Speak now!";

    recognition.onresult = function(event) {
        const spokenText = event.results[0][0].transcript;

        expressionInput.value = spokenText;
        statusDisplay.textContent = "You said: " + spokenText;

        calculate();
    };

    recognition.onerror = function() {
        statusDisplay.textContent =
            "Microphone error. Please try again.";
    };

    recognition.onend = function() {
        voiceEnabled = false;
    };

    try {
        recognition.start();
    } catch (error) {
        statusDisplay.textContent = "Please try the microphone again.";
    }
}

expressionInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        calculate();
    }
});
</script>

</body>
</html>
